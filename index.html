<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Calculator</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/x-icon" href="favicon.ico">
  </head>
  <body>
    
    <div id="Container">

      <div id="Calculator-Case">
        <div id="Calculator-Base">

          <div id="Screen-Container">
            <div id="Screen">
              <span id="Display-Text"></span>
              <div id="Cursor"></div>
              <span id="Result-Text"></span> 
              <div id="Display_Divider"></div>
              <span id="Display-Text2"></span>
              <div id="Cursor2"></div>
            </div>
          </div>
          
        <div id="Divider"></div>

        <div id="Button-Grid-Container">
          <button class="button-blue">2nd</button>
          <button class="button-black">mode</button>
          <button class="button-black">X,T,θ,n</button>
          <button class="button-black", id="del">del</button>
          <button class="button-black", id="clear">clear</button>

          <button class="button-black">x⁻¹</button>
          <button class="button-black">sin</button>
          <button class="button-black">cos</button>
          <button class="button-black">tan</button>
          <button class="button-black", id="^">^</button>
          
          <button class="button-black">x²</button>
          <button class="button-black">√</button>
          <button class="button-black", id="(">(</button>
          <button class="button-black", id=")">)</button>
          <button class="button-white", id="/">÷</button>

          <button class="button-black">log</button>
          <button class="button-white", id="7">7</button>
          <button class="button-white", id="8">8</button>
          <button class="button-white", id="9">9</button>
          <button class="button-white", id="x">x</button>

          <button class="button-black">ln</button>
          <button class="button-white", id="4">4</button>
          <button class="button-white", id="5">5</button>
          <button class="button-white", id="6">6</button>
          <button class="button-white", id="-">-</button>

          <button class="button-black">sto→</button>
          <button class="button-white", id="1">1</button>
          <button class="button-white", id="2">2</button>
          <button class="button-white", id="3">3</button>
          <button class="button-white", id="+">+</button>

          <button class="button-black" id="on">on</button>
          <button class="button-white", id="0">0</button>
          <button class="button-white", id=".">.</button>
          <button class="button-white", id="(-)">(-)</button>
          <button class="button-white", id="enter">enter</button>
        </div>

        </div>
      </div>

    </div>

    <script src="script.js"></script>
  </body>
</html>
