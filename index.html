<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    
    <div id="Container">

      <div id="Calculator-Case">
        <div id="Calculator-Base">

          <div id="Screen-Container">
            <div id="Screen">

            </div>
          </div>
          
        <div id="Divider"></div>

        <div id="Button-Grid-Container">
          <button class="button-blue">2nd</button>
          <button class="button-black">mode</button>
          <button class="button-black">X,T,θ,n</button>
          <button class="button-black">del</button>
          <button class="button-black">clear</button>

          <button class="button-black">x⁻¹</button>
          <button class="button-black">sin</button>
          <button class="button-black">cos</button>
          <button class="button-black">tan</button>
          <button class="button-black">^</button>
          
          <button class="button-black">x²</button>
          <button class="button-black">√</button>
          <button class="button-black">(</button>
          <button class="button-black">)</button>
          <button class="button-white">÷</button>

          <button class="button-black">log</button>
          <button class="button-white">7</button>
          <button class="button-white">8</button>
          <button class="button-white">9</button>
          <button class="button-white">x</button>

          <button class="button-black">ln</button>
          <button class="button-white">4</button>
          <button class="button-white">5</button>
          <button class="button-white">6</button>
          <button class="button-white">-</button>

          <button class="button-black">sto →</button>
          <button class="button-white">1</button>
          <button class="button-white">2</button>
          <button class="button-white">3</button>
          <button class="button-white">+</button>

          <button class="button-black" id="on">on</button>
          <button class="button-white">0</button>
          <button class="button-white">.</button>
          <button class="button-white">(-)</button>
          <button class="button-white">enter</button>
        </div>

        </div>
      </div>

    </div>

    <script src="script.js"></script>
  </body>
</html>
